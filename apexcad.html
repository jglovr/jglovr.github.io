<body class="dark-theme">
  <div id="app" class="app-layout">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand-section">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div class="brand-title">
          <span class="brand-name">Apex<span class="highlight">CAD</span></span>
          <input type="text" id="project-title" class="project-name-input" value="Untitled Design" title="Click to rename project">
        </div>
      </div>

      <div class="action-toolbar">
        <div class="tool-group">
          <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)" disabled>
            <svg class="icon"><use href="#icon-undo"/></svg>
          </button>
          <button id="btn-redo" class="tool-btn" title="Redo (Ctrl+Y)" disabled>
            <svg class="icon"><use href="#icon-redo"/></svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-group">
          <button id="btn-group" class="tool-btn action-highlight" title="Group / CSG Union & Subtract (Ctrl+G)">
            <svg class="icon"><use href="#icon-group"/></svg>
            <span>Group</span>
          </button>
          <button id="btn-ungroup" class="tool-btn" title="Ungroup CSG Shape (Ctrl+Shift+G)">
            <svg class="icon"><use href="#icon-ungroup"/></svg>
            <span>Ungroup</span>
          </button>
          <button id="btn-intersect" class="tool-btn" title="CSG Intersect">
            <svg class="icon"><use href="#icon-intersect"/></svg>
            <span>Intersect</span>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-group">
          <button id="btn-align" class="tool-btn" title="Align Objects (L)">
            <svg class="icon"><use href="#icon-align"/></svg>
            <span>Align</span>
          </button>
          <div class="flip-tool-container">
            <button id="btn-flip" class="tool-btn" title="Mirror / Flip across Volume Center (M)">
              <svg class="icon"><use href="#icon-flip"/></svg>
              <span>Flip</span>
            </button>
            <div class="axis-btn-group">
              <button id="btn-flip-x" class="axis-pill-btn" title="Flip X across Volume Center">X</button>
              <button id="btn-flip-y" class="axis-pill-btn" title="Flip Y across Volume Center">Y</button>
              <button id="btn-flip-z" class="axis-pill-btn" title="Flip Z across Volume Center">Z</button>
            </div>
          </div>
          <button id="btn-duplicate" class="tool-btn" title="Duplicate (Ctrl+D)">
            <svg class="icon"><use href="#icon-duplicate"/></svg>
          </button>
          <button id="btn-delete" class="tool-btn btn-danger" title="Delete Object (Delete)">
            <svg class="icon"><use href="#icon-trash"/></svg>
          </button>
        </div>

        <div class="tool-divider"></div>

        <div class="tool-group">
          <label class="tool-btn btn-primary" title="Open CAD Project Save File (XML)">
            <svg class="icon"><use href="#icon-upload"/></svg>
            <span>Open XML</span>
            <input type="file" id="xml-file-input" accept=".xml,.apex" style="display: none;">
          </label>
          <button id="btn-export-xml" class="tool-btn action-highlight" title="Save Complete CAD Project to XML Save File">
            <svg class="icon"><use href="#icon-download"/></svg>
            <span>Save XML</span>
          </button>
          <label class="tool-btn" title="Import STL File">
            <svg class="icon"><use href="#icon-upload"/></svg>
            <span>Import STL</span>
            <input type="file" id="stl-file-input" accept=".stl" style="display: none;">
          </label>
          <button id="btn-export-stl" class="tool-btn btn-success" title="Export Model to STL Format">
            <svg class="icon"><use href="#icon-download"/></svg>
            <span>Export STL</span>
          </button>
          <button id="btn-install-pwa" class="tool-btn action-highlight" style="display: none;" title="Install ApexCAD 3D as a Desktop / Mobile Progressive Web App">
            <span>💻 Install App</span>
          </button>
          <button id="btn-toggle-sidebar" class="tool-btn" title="Toggle Property Inspector Sidebar (ON/OFF)">
            <span>▶ Sidebar</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Studio Workspace -->
    <main class="studio-body">
      <!-- Floating Left Toolbar -->
      <aside class="left-toolbar">
        <button id="btn-home-view" class="left-btn" title="Reset View (F)">
          <svg class="icon"><use href="#icon-home"/></svg>
        </button>
        <button id="btn-zoom-fit" class="left-btn" title="Fit to Selection">
          <svg class="icon"><use href="#icon-maximize"/></svg>
        </button>
        <button id="btn-camera-toggle" class="left-btn" title="Toggle Perspective / Orthographic Camera">
          <span class="cam-badge" id="cam-type-badge">3D</span>
        </button>

        <div class="left-divider"></div>

        <button id="btn-toggle-faces" class="left-btn active" title="Toggle Solid Faces (ON/OFF)">
          <svg class="icon"><use href="#icon-box"/></svg>
        </button>
        <button id="btn-toggle-edges" class="left-btn active" title="Toggle Vertex Lines / Edge Outlines (ON/OFF)">
          <svg class="icon"><use href="#icon-grid"/></svg>
        </button>
        <button id="btn-toggle-xray" class="left-btn" title="Toggle X-Ray / Transparency (ON/OFF)">
          <svg class="icon"><use href="#icon-eye"/></svg>
        </button>
      </aside>

      <!-- 3D Canvas Viewport -->
      <div id="canvas-container" class="canvas-viewport">
        <canvas id="three-canvas"></canvas>

        <!-- Interactive Native 3D WebGL View Cube Overlay -->
        <div id="view-cube-wrapper" class="view-cube-overlay">
          <div id="view-cube" style="width: 100%; height: 100%;"></div>
        </div>

        <!-- On-Canvas Tinkercad Dimension Overlay Label -->
        <div id="dimension-badge" class="dimension-badge hidden">
          <span id="dim-text">20.00 mm</span>
        </div>
      </div>

      <!-- Right Sidebar (Shapes & Properties Inspector) -->
      <aside class="right-sidebar">
        <!-- Sidebar Tabs Header -->
        <div class="sidebar-tabs">
          <button id="tab-shapes-btn" class="tab-btn active" data-tab="shapes">
            <svg class="icon"><use href="#icon-shapes"/></svg>
            <span>Shapes</span>
          </button>
          <button id="tab-inspector-btn" class="tab-btn" data-tab="inspector">
            <svg class="icon"><use href="#icon-sliders"/></svg>
            <span>Inspector</span>
          </button>
          <button id="tab-layers-btn" class="tab-btn" data-tab="layers">
            <svg class="icon"><use href="#icon-grid"/></svg>
            <span>Layers</span>
          </button>
        </div>

        <!-- Tab 1: Basic Shapes Library -->
        <div id="tab-shapes" class="tab-content active">
          <div class="section-title">Basic Shapes (Drag to Place)</div>
          <div class="shapes-grid">
            <button class="shape-card" data-shape="box" draggable="true" title="Drag to place Box on Workplane">
              <div class="shape-preview">
                <svg viewBox="0 0 48 48" class="shape-icon-svg">
                  <path d="M24 6L40 15V33L24 42L8 33V15L24 6Z" fill="#2563eb"/>
                  <path d="M24 6L40 15L24 24L8 15L24 6Z" fill="#60a5fa"/>
                  <path d="M24 24V42L40 33V15L24 24Z" fill="#1d4ed8"/>
                </svg>
