                        <svg class="svg-icon tool-icon" viewBox="0 0 24 24"><path d="M12 3C7 3 4 8 4 12C4 17 8 21 13 21C18 21 20 17 20 12C14 12 12 7 12 3Z" fill="#33cc66" stroke="#116622" stroke-width="1.5"/><path d="M4 12C9 12 12 14 13 21" stroke="#116622" stroke-width="1.5"/></svg>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- Retro MS Paint / Stardew Tool Window Dev Panel (Toggled with Ctrl+Shift+D or ` key) -->
    <div id="dev-panel" class="dev-panel hidden">
        <div class="dev-header">
            <span class="dev-header-title">
                <svg class="svg-icon dev-icon" viewBox="0 0 24 24"><polygon points="13,2 4,14 11,14 9,22 20,9 13,9" fill="#ffcc00" stroke="#886600"/></svg>
                Dev Tool Window
            </span>
            <span class="dev-hotkey">Ctrl+Shift+D</span>
        </div>
        
        <div class="dev-section">
            <span class="dev-section-title">
                <svg class="svg-icon dev-icon-sm" viewBox="0 0 24 24"><path d="M6 2H18V7L13 12L18 17V22H6V17L11 12L6 7V2Z" fill="#f4e8c5" stroke="#3d2314" stroke-width="1.5"/><polygon points="8,4 16,4 12,9" fill="#ffaa00"/></svg>
                Time Speed
            </span>
            <div class="dev-btn-row">
                <button id="dev-speed-1" class="dev-btn active">1x</button>
                <button id="dev-speed-2" class="dev-btn">2x</button>
                <button id="dev-speed-5" class="dev-btn">5x</button>
                <button id="dev-speed-10" class="dev-btn">10x</button>
                <button id="dev-speed-25" class="dev-btn">25x</button>
            </div>
            <div class="dev-btn-row">
                <button id="dev-time-day" class="dev-btn">
                    <svg class="svg-icon dev-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffcc00" stroke="#aa7700"/><path d="M12 2V4M12 20V22M2 12H4M20 12H22M4.9 4.9L6.3 6.3M17.7 17.7L19.1 19.1M4.9 19.1L6.3 17.7M17.7 6.3L19.1 4.9" stroke="#ffcc00" stroke-width="2" stroke-linecap="round"/></svg>
                    Day
                </button>
                <button id="dev-time-night" class="dev-btn">
                    <svg class="svg-icon dev-icon-sm" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="#99ccff" stroke="#3366bb" stroke-width="1.5"/></svg>
                    Night
                </button>
                <button id="dev-time-skip" class="dev-btn">
                    <svg class="svg-icon dev-icon-sm" viewBox="0 0 24 24"><polygon points="4,4 13,12 4,20" fill="#f4e8c5" stroke="#3d2314"/><polygon points="12,4 21,12 12,20" fill="#f4e8c5" stroke="#3d2314"/></svg>
                    +1 Min
                </button>
            </div>
        </div>

        <div class="dev-section">
            <span class="dev-section-title">
                <svg class="svg-icon dev-icon-sm" viewBox="0 0 24 24"><polygon points="12,2 21,8 12,22 3,8" fill="#00e5ff" stroke="#0077aa" stroke-width="1.5"/></svg>
                Add Gems
            </span>
            <div class="dev-btn-grid">
                <button id="dev-gem-blue" class="dev-btn blue">+10 Blue</button>
                <button id="dev-gem-red" class="dev-btn red">+10 Red</button>
                <button id="dev-gem-yellow" class="dev-btn yellow">+10 Yellow</button>
                <button id="dev-gem-orange" class="dev-btn orange">+10 Orange</button>
                <button id="dev-gem-magenta" class="dev-btn magenta">+10 Magenta</button>
                <button id="dev-gem-max" class="dev-btn max">Max All (99)</button>
            </div>
        </div>
    </div>



</body>
</html>
